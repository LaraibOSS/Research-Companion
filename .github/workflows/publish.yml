name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify tag matches version and is on main
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$TAG_VERSION" = "$PROJECT_VERSION" ] || { echo "tag $TAG_VERSION != project $PROJECT_VERSION"; exit 1; }
          git fetch origin main --quiet
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || { echo "tagged commit not reachable from main"; exit 1; }

      - name: Install dev deps + build tools
        run: python -m pip install -e ".[dev]" build twine

      - name: Run pytest -q
        run: python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run JS tests
        run: node --test tests/js/*.test.mjs

      - name: Build distributions
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/research-companion --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: [build]
    if: github.repository == 'LaraibOSS/Research-Companion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/research-companion/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
