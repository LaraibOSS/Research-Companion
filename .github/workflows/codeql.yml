name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning needs a public repo or GitHub Advanced Security. On a private
    # repo without GHAS the init step errors ("Resource not accessible by
    # integration"), so skip when we can positively confirm the repo is private.
    # `!= true` still runs whenever public (all triggers), so scanning auto-resumes.
    if: ${{ github.event.repository.private != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  codeql-ok:
    name: codeql-ok
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - name: CodeQL passed?
        run: |
          set -euo pipefail
          r="${{ needs.analyze.result }}"
          # "skipped" == analyze was gated off on a private/no-GHAS repo (not a failure).
          [ "$r" = "success" ] || [ "$r" = "skipped" ] || { echo "CodeQL failed: $r"; exit 1; }
