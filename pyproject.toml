[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papergraph"
version = "0.1.0"
description = "Drop arXiv URLs or PDFs in, get an interactive knowledge graph and a chat interface that answers questions with paper citations. Local-first, open source, KG-aware retrieval."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["knowledge-graph", "rag", "arxiv", "papers", "literature-review", "research", "llm", "claude", "openai"]
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Azizur", email = "azizur100389@gmail.com" },
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "pypdf>=4.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "jinja2>=3.1",
    "feedparser>=6.0",
]

[project.urls]
Repository = "https://github.com/azizur100389/papergraph"
Issues = "https://github.com/azizur100389/papergraph/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
papergraph = "papergraph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["papergraph*"]

[tool.setuptools.package-data]
papergraph = ["templates/*.html", "templates/*.css", "templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
