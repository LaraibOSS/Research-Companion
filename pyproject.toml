[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-companion"
version = "0.7.1"
description = "An agentic research companion that verifies what it claims"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["knowledge-graph", "rag", "arxiv", "papers", "literature-review", "research", "llm", "claude", "openai"]
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Laraib Hasan", email = "Lxh417bham@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "pypdfium2>=4",
    "httpx>=0.27",
    "networkx>=3.0",
    "jinja2>=3.1",
    "feedparser>=6.0",
]

[project.urls]
Homepage = "https://github.com/Laraib-Hasan-Future/Research-Companion"
Repository = "https://github.com/Laraib-Hasan-Future/Research-Companion"
Documentation = "https://github.com/Laraib-Hasan-Future/Research-Companion/blob/main/docs/DOCUMENTATION.md"
Changelog = "https://github.com/Laraib-Hasan-Future/Research-Companion/blob/main/docs/RELEASE_0.7.md"
Issues = "https://github.com/Laraib-Hasan-Future/Research-Companion/issues"

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
docling = [
    "docling>=2",
]
mcp = [
    # Upper-bounded: mcp 2.0.0 removed `mcp.server.fastmcp` (which mcp_server.py
    # imports FastMCP from); the 1.x line still ships it. Revisit when the code
    # is ported to the 2.x SDK layout.
    "mcp>=1.0,<2",
]
semantic = [
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
research-companion = "research_companion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_companion*"]

[tool.setuptools.package-data]
research_companion = [
    "data/*.json",
    "templates/*.html",
    "templates/*.css",
    "templates/*.js",
    "lab/static/index.html",
    "lab/static/css/*",
    "lab/static/js/*.js",
    "lab/static/js/**/*.js",
    "lab/static/vendor/*",
    "lab/static/vendor/pdfjs/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: slow tests (real docling conversion; may download models / need network)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
