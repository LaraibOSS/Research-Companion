<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Companion</title>
  <script>
    (function(){var d=document.documentElement.dataset;var s=localStorage;d.theme=s.getItem('rc.theme')||'dark';d.accent=s.getItem('rc.accent')||'blue';d.density=s.getItem('rc.density')||'comfortable';})();
  </script>
  <link rel="stylesheet" href="/static/css/lab.css">
</head>
<body>
  <div class="app">
    <!-- Navigation Rail (expanded 208px labeled sidebar; collapses to 56px icon-only below 640px) -->
    <nav class="nav-rail" aria-label="Main navigation">
      <button class="nav-btn" data-route="/home" title="Home" data-desc="your dashboard and next steps"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5L9 2l7 5.5V16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5z"/><path d="M6.5 17V11h5v6"/></svg><span class="nav-label">Home</span></button>
      <button class="nav-btn" data-route="/researches" title="Researches" data-desc="track all your research projects at a glance"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5a1 1 0 0 1 1-1h3l1.5 2H15a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z"/></svg><span class="nav-label">Researches</span></button>
      <button class="nav-btn active" data-route="/library" title="Library" data-desc="your ingested papers and their status"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="4" height="12" rx="1"/><rect x="7" y="3" width="4" height="12" rx="1"/><rect x="12" y="3" width="4" height="12" rx="1"/></svg><span class="nav-label">Library</span></button>
      <button class="nav-btn" data-route="/graph" title="Graph" data-desc="the live knowledge graph of your papers"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="2"/><circle cx="3" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="3" cy="13" r="1.5"/><circle cx="15" cy="13" r="1.5"/><line x1="7.3" y1="7.7" x2="4.2" y2="6.2"/><line x1="10.7" y1="7.7" x2="13.8" y2="6.2"/><line x1="7.3" y1="10.3" x2="4.2" y2="11.8"/><line x1="10.7" y1="10.3" x2="13.8" y2="11.8"/></svg><span class="nav-label">Graph</span></button>
      <button class="nav-btn" data-route="/draft" title="Draft" data-desc="how each paper aligns with the paper you're writing"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6l-3-4z"/><path d="M11 2v4h3"/><path d="M7 10l1.5 1.5L12 8"/></svg><span class="nav-label">Draft</span></button>
      <button class="nav-btn" data-route="/timeline" title="Timeline" data-desc="concepts, methods, and gaps over time"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7"/><polyline points="9,5 9,9 12,11"/></svg><span class="nav-label">Timeline</span></button>
      <button class="nav-btn" data-route="/gaps" title="Gaps" data-desc="research gaps across your papers, as actionable bullets"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2L15 9L9 16L3 9Z"/></svg><span class="nav-label">Gaps</span></button>
      <button class="nav-btn" data-route="/ask" title="Ask" data-desc="grounded Q&amp;A with citations to your papers"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3l3 3 3-3h3a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"/></svg><span class="nav-label">Ask</span></button>
      <button class="nav-btn" data-route="/compare" title="Compare" data-desc="a head-to-head of any two papers"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="6" height="14" rx="1"/><rect x="10" y="2" width="6" height="14" rx="1"/></svg><span class="nav-label">Compare</span></button>
      <button class="nav-btn" id="topbar-placement" title="Citations" data-desc="which cited references are in your library"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5c-2.9 0-5.2 2.3-5.2 5.2 0 3.6 5.2 9.3 5.2 9.3s5.2-5.7 5.2-9.3c0-2.9-2.3-5.2-5.2-5.2z"/><circle cx="9" cy="6.7" r="2"/></svg><span class="nav-label">Citations</span></button>
      <button class="nav-btn" data-route="/notes" title="Notes" data-desc="your saved notes and revision checklist"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="12" height="14" rx="1"/><line x1="6" y1="2" x2="6" y2="16"/><line x1="8.5" y1="6" x2="12.5" y2="6"/><line x1="8.5" y1="9" x2="12.5" y2="9"/><line x1="8.5" y1="12" x2="12.5" y2="12"/></svg><span class="nav-label">Notes</span></button>
      <div class="nav-spacer"></div>
      <button class="nav-btn" id="topbar-help" title="Help" data-desc="guides and glossary"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7"/><path d="M6.8 6.8a2.5 2.5 0 1 1 2.5 2.5c0 0-0.3.7-0.3 1.7"/><circle cx="9" cy="13" r="0.5" fill="currentColor"/></svg><span class="nav-label">Help</span></button>
      <button class="nav-btn" data-route="/settings" title="Settings" data-desc="provider, keys, appearance, retrieval"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="2.5"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.42 1.42M13.36 13.36l1.42 1.42M3.22 14.78l1.42-1.42M13.36 4.64l1.42-1.42"/></svg><span class="nav-label">Settings</span></button>
    </nav>

    <!-- Top Bar -->
    <header class="topbar">
      <span class="topbar-title">Research Companion</span>
      <button id="workspace-switcher" class="ws-switcher" style="display:none"></button>
      <span id="draft-chip" class="draft-chip" style="display:none"></span>
      <span class="topbar-spacer"></span>
      <span id="activity-indicator" class="activity-indicator" style="display:none"><span class="activity-spin" aria-hidden="true"></span><span id="activity-label"></span></span>
      <span id="connection-pill" class="conn-pill conn-disconnected">Offline</span>
      <button id="topbar-bell" class="bell-btn" aria-label="Suggestions">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2a5 5 0 0 1 5 5v3l1.5 2.5H2.5L4 10V7a5 5 0 0 1 5-5z"/><path d="M7 14a2 2 0 0 0 4 0"/></svg>
        <span id="bell-badge" class="bell-badge"></span>
      </button>
      <button id="topbar-add" class="btn btn-accent">+ Add papers</button>
    </header>

    <!-- No-key banner (store-driven, main.js controls .visible / .soft + text) -->
    <div id="no-key-banner" role="alert">
      <span id="no-key-text">Connect a model to unlock analysis &rarr; </span><a id="no-key-link">Settings</a>
    </div>

    <!-- Citation coverage banner (session-only, main.js controls .visible) -->
    <div id="citations-banner" role="status"><span id="citations-banner-text"></span>&nbsp;&mdash;&nbsp;<a id="citations-banner-link">Add missing</a> <button id="citations-banner-collapse" aria-label="Collapse">&times;</button></div>

    <!-- Missing-metadata banner (session-only, main.js controls .visible) -->
    <div id="metadata-banner" role="status"><span id="metadata-banner-text"></span>&nbsp;&mdash;&nbsp;<a id="metadata-banner-link">Review library</a> <button id="metadata-banner-collapse" aria-label="Collapse">&times;</button></div>

    <!-- Main view mount point -->
    <main id="view"></main>
  </div>

  <!-- Progress dock mount point -->
  <div id="dock"></div>

  <!-- Graph canvas: PERSISTENT hidden container for F2 (never unmounted) -->
  <div id="graph-canvas" style="display:none;position:absolute;inset:0;pointer-events:none;"></div>

  <!-- vis-network 9.1.9 standalone UMD (MIT license, vendored for offline use) -->
  <script src="/static/vendor/vis-network.min.js"></script>

  <!-- Research Companion SPA entry point -->
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
